<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0F3D2E">
  <title>نظام متابعة الطلاب — مشروع فسيروا القرآني</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --green: #23512C;
  --green-2: #33723C;
  --green-3: #4F9A57;
  --green-soft: #E7F1E5;
  --sky: #DDEBF8;
  --paper: #F5F7F4;
  --surface: #FFFFFF;
  --ink: #17231F;
  --ink-2: #3A4944;
  --muted: #64746D;
  --line: #D9E1DC;
  --line-2: #EBF0EC;
  --gold: #A9822F;
  --gold-2: #C9A24E;
  --gold-soft: #F4ECD9;
  --red: #A3312A;
  --red-soft: #F8E7E5;
  --blue: #2F6FA3;
  --blue-soft: #E5EEF6;
  --r-s: 6px; --r: 10px; --r-l: 18px;
  --sans: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --naskh: "Noto Naskh Arabic", "Traditional Arabic", "IBM Plex Sans Arabic", serif;
  --sidebar: 256px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --heading: #23512C;
  --topbar-bg: rgba(245,247,244,.92);
  --row-hover: var(--row-hover);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0D1613; --surface: #15201C; --ink: #E3EBE7; --ink-2: #C2CFC9; --muted: #8FA39A;
  --line: #29382F; --line-2: #1F2C27; --green-soft: #173529; --gold-soft: #3A3019; --red-soft: #3B201D; --blue-soft: #1A2A39;
  --heading: #B9DCC9; --sky: #1B2A36; --topbar-bg: rgba(13,22,19,.9); --row-hover: #1A2722; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #0D1613; --surface: #15201C; --ink: #E3EBE7; --ink-2: #C2CFC9; --muted: #8FA39A;
  --line: #29382F; --line-2: #1F2C27; --green-soft: #173529; --gold-soft: #3A3019; --red-soft: #3B201D; --blue-soft: #1A2A39;
  --heading: #B9DCC9; --sky: #1B2A36; --topbar-bg: rgba(13,22,19,.9); --row-hover: #1A2722; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--paper); }
:root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; font: 400 15px/1.65 var(--sans); color: var(--ink); background: var(--paper); }
h1, h2, h3, h4 { margin: 0; line-height: 1.35; }
p { margin: 0; }
a { color: var(--green-2); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 2px; }
.ic { flex: none; display: block; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.nowrap { white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- الإقلاع وتسجيل الدخول ---------- */
.boot { min-height: 100vh; display: grid; place-content: center; gap: 14px; justify-items: center; color: var(--muted); }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--green-2); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.login { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
.login-side { background: #fff; color: var(--ink-2); padding: 48px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; border-inline-start: 1px solid var(--line); text-align: center; }
.login-side img { width: min(380px, 90%); height: auto; }
.login-side span { font-size: 13px; color: var(--muted); }
.login-side h1 { font-family: var(--naskh); font-size: 40px; color: #fff; }
.login-form { display: grid; place-content: center; padding: 32px; }
.login-form form { width: min(360px, 100%); display: grid; gap: 14px; }
.login-form h2 { font-family: var(--naskh); font-size: 26px; }

/* ---------- الهيكل ---------- */
.shell { display: grid; grid-template-columns: var(--sidebar) 1fr; min-height: 100vh; }
.sidebar { position: sticky; top: 0; height: 100vh; height: 100dvh; background: var(--surface); border-inline-start: 1px solid var(--line); display: flex; flex-direction: column; padding: 18px 14px; gap: 14px; overflow-y: auto; }
.brand { display: grid; justify-items: center; gap: 4px; padding: 0 6px 12px; border-bottom: 1px solid var(--line-2); text-align: center; }
.brand img { width: 100%; max-width: 200px; height: auto; border-radius: var(--r); background: #fff; }
.brand span { font-size: 13px; color: var(--muted); }
.nav-today { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: var(--r); background: var(--green-2); color: #fff; font-weight: 700; }
.nav-today:hover { background: var(--green); }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: var(--r-s); color: var(--ink-2); font-weight: 500; }
.nav a:hover { background: var(--paper); color: var(--ink); }
.nav a.active { background: var(--green-soft); color: var(--heading); font-weight: 600; }
.nav-today.active { box-shadow: 0 0 0 3px var(--green-soft); }
.sidebar-foot { margin-top: auto; font-size: 12px; color: var(--muted); padding: 10px 6px 0; border-top: 1px solid var(--line-2); text-align: center; }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; gap: 14px; padding: 12px 28px; background: var(--topbar-bg); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topbar .sem { font-size: 13px; color: var(--muted); }
.topbar .spacer { flex: 1; }
.user-chip { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.user-chip select { border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); padding: 4px 8px; font-size: 13px; }
.m-title { display: none; }
.m-title img { border-radius: 50%; background: #fff; flex: none; }
.view { padding: 26px 28px 60px; width: 100%; max-width: 1240px; margin: 0 auto; }
.demo-flag { font-size: 12px; background: var(--gold-soft); color: #6E5418; padding: 3px 10px; border-radius: 99px; }

/* ---------- عناوين الصفحات ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head h1 { font-family: var(--naskh); font-size: 30px; font-weight: 700; color: var(--heading); }
.page-head p { color: var(--muted); margin-top: 2px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 14px; margin-bottom: 6px; }

/* ---------- الأزرار ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 16px; border-radius: var(--r-s); border: 1px solid transparent; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background .15s, border-color .15s; }
.btn-primary { background: var(--green-2); color: #fff; }
.btn-primary:hover { background: var(--green); }
.btn-gold { background: var(--gold-2); color: #0F3D2E; }
.btn-gold:hover { background: #D6B25F; }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink-2); }
.btn-ghost:hover { border-color: #B9C6BE; }
.btn-danger { background: var(--red); color: #fff; }
.btn-soft-danger { background: var(--surface); border-color: #E9C9C5; color: var(--red); }
.btn-sm { min-height: 32px; padding: 4px 11px; font-size: 13px; }
.btn-icon { display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: var(--r-s); border: 0; background: transparent; color: var(--muted); cursor: pointer; }
.btn-icon:hover { background: var(--line-2); color: var(--ink); }
.btn.loading { position: relative; color: transparent !important; pointer-events: none; }
.btn.loading::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.45); border-top-color: #fff; animation: spin .7s linear infinite; }
.btn-ghost.loading::after { border-color: var(--line); border-top-color: var(--green-2); }
.btn:disabled { opacity: .55; cursor: not-allowed; }

/* ---------- اللوحات ---------- */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.panel-pad { padding: 18px 20px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line-2); }
.panel-head h2, .panel-head h3 { font-size: 16px; font-weight: 700; }
.panel-body { padding: 16px 20px; }
.grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.grid-2 { display: grid; gap: 18px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid-3 { display: grid; gap: 18px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stack { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.mt { margin-top: 18px; }

/* ---------- شريط الفصل (أسابيع) ---------- */
.semester { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 20px 22px; display: grid; gap: 14px; }
.semester-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.semester h2 { font-family: var(--naskh); font-size: 22px; color: var(--heading); }
.semester .dates { font-size: 13px; color: var(--muted); }
.week-now { text-align: left; }
.week-now b { font-size: 28px; color: var(--green-2); font-weight: 700; line-height: 1; }
.week-now span { display: block; font-size: 13px; color: var(--muted); }
.weeks { display: flex; gap: 4px; direction: rtl; }
.weeks i { flex: 1; height: 8px; border-radius: 3px; background: var(--line-2); }
.weeks i.past { background: var(--green-3); }
.weeks i.now { background: var(--green-2); height: 12px; margin-top: -2px; }

/* ---------- الإحصاءات ---------- */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stat { padding: 16px 20px; border-inline-start: 1px solid var(--line-2); }
.stats .stat:nth-child(4n+1) { border-inline-start: 0; }
.stats .stat:nth-child(n+5) { border-top: 1px solid var(--line-2); }
.stat b { display: block; font-size: 24px; font-weight: 700; color: var(--heading); line-height: 1.3; }
.stat b.txt { font-size: 15px; line-height: 1.5; }
.stat span { font-size: 13px; color: var(--muted); }

/* ---------- دوام اليوم (لوحة الرئيسية) ---------- */
.today-panel { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.today-panel h3 { font-size: 18px; color: var(--heading); }
.today-panel .facts { display: flex; gap: 18px; font-size: 14px; color: var(--ink-2); margin-top: 4px; flex-wrap: wrap; }

/* ---------- القوائم ---------- */
.list { display: grid; grid-template-columns: minmax(0, 1fr); }
.li { display: flex; align-items: center; gap: 12px; padding: 11px 20px; border-top: 1px solid var(--line-2); }
.li:first-child { border-top: 0; }
a.li { color: inherit; }
a.li:hover { background: var(--row-hover); }
.li .grow { flex: 1; min-width: 0; }
.li .name { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .sub { font-size: 13px; color: var(--muted); }
.avatar { display: inline-grid; place-items: center; border-radius: 50%; background: var(--green-soft); color: var(--green-2); font-weight: 700; object-fit: cover; flex: none; white-space: nowrap; overflow: hidden; }
.bar { flex: 1 1 auto; min-width: 50px; height: 7px; background: var(--line-2); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green-3); border-radius: 99px; }
.bar.gold i { background: var(--gold-2); }
.bars { display: grid; gap: 6px; min-width: 150px; }
.bars label { display: grid; grid-template-columns: 52px 1fr 38px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.b-green { background: var(--green-soft); color: var(--green-2); }
.b-gold { background: var(--gold-soft); color: #7A5C1B; }
.b-red { background: var(--red-soft); color: var(--red); }
.b-gray { background: var(--line-2); color: var(--ink-2); }
.b-blue { background: var(--blue-soft); color: var(--blue); }
.empty { padding: 34px 20px; text-align: center; color: var(--muted); display: grid; gap: 12px; justify-items: center; }

/* ---------- النماذج ---------- */
.field { display: grid; gap: 5px; }
.field > span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.field small { color: var(--muted); font-size: 12px; }
.input, .field input:not([type=checkbox]):not([type=radio]):not([type=file]), .field select, .field textarea, .toolbar input, .toolbar select {
  width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface);
}
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus, .toolbar input:focus, .toolbar select:focus, .input:focus { outline: none; border-color: var(--green-3); box-shadow: 0 0 0 3px rgba(46,122,92,.14); }
.invalid { border-color: var(--red) !important; }
.form-grid { display: grid; gap: 14px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
.check-row { display: flex; flex-wrap: wrap; gap: 6px; }
.check-row label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 99px; cursor: pointer; font-size: 14px; background: var(--surface); }
.check-row input { accent-color: var(--green-2); }
.check-row label:has(input:checked) { border-color: var(--green-3); background: var(--green-soft); color: var(--heading); }
.pick-list { max-height: 240px; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--r-s); }
.pick-list label { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line-2); cursor: pointer; }
.pick-list label:first-child { border-top: 0; }
.hint { background: var(--green-soft); border-radius: var(--r-s); padding: 10px 14px; font-size: 14px; color: var(--heading); }
.hint.warn { background: var(--gold-soft); color: #6E5418; }

/* ---------- شريط الأدوات ---------- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
.toolbar .search { position: relative; flex: 1 1 240px; }
.toolbar .search .ic { position: absolute; inset-inline-start: 11px; top: 11px; color: var(--muted); }
.toolbar .search input { padding-inline-start: 38px; }
.toolbar select { width: auto; min-width: 140px; }

/* ---------- بطاقات الطلاب ---------- */
.s-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.s-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; color: inherit; position: relative; }
.s-card:hover { border-color: #B6C8BE; }
.s-photo { position: relative; aspect-ratio: 4 / 3; background: var(--sky); display: grid; place-items: center; }
.s-photo img { width: 100%; height: 100%; object-fit: cover; }
.s-photo > span { font-size: 38px; font-weight: 700; color: var(--green-2); opacity: .55; white-space: nowrap; }
.s-photo .cam { position: absolute; inset-inline-start: 10px; bottom: 10px; width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.92); color: var(--green); display: grid; place-items: center; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
.s-info { padding: 12px 14px 14px; display: grid; gap: 8px; }
.s-card h3 { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.s-card .meta { display: flex; gap: 10px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.s-card .edit { position: absolute; inset-inline-end: 8px; top: 8px; background: rgba(255,255,255,.9); }
.kv-mini { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin: 0; }
.kv-mini dt { color: var(--muted); }
.kv-mini dd { margin: 0; font-weight: 600; }
.photo-edit { position: relative; cursor: pointer; display: inline-block; }
.photo-edit .cam-badge { position: absolute; bottom: 0; inset-inline-start: 0; width: 30px; height: 30px; border-radius: 50%; background: var(--green-2); color: #fff; display: grid; place-items: center; border: 2px solid var(--paper); }

/* ---------- صور الدوامات ---------- */
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; padding: 14px; }
.ph { position: relative; border: 0; padding: 0; border-radius: var(--r-s); overflow: hidden; aspect-ratio: 4 / 3; cursor: zoom-in; background: var(--line-2); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph span { position: absolute; bottom: 6px; inset-inline-start: 6px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 1px 8px; border-radius: 99px; }
.ph-preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
.ph-preview:empty { display: none; }
.ph-preview img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: var(--r-s); }
.ph-full { width: 100%; max-height: 70vh; object-fit: contain; border-radius: var(--r-s); background: #000; }
.method p { margin-bottom: 10px; line-height: 1.9; }

/* ---------- ملف الطالب ---------- */
.profile-head { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.profile-head h1 { font-family: var(--naskh); font-size: 28px; color: var(--heading); }
.profile-head .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 22px 0 18px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 10px 14px; border: 0; background: none; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab[aria-selected=true] { color: var(--heading); border-bottom-color: var(--gold-2); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 500; }
.metric-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.metric { background: var(--paper); border-radius: var(--r-s); padding: 10px 12px; }
.metric b { display: block; font-size: 18px; color: var(--heading); }
.metric span { font-size: 12px; color: var(--muted); }
.big-pct { display: flex; align-items: center; gap: 12px; }
.big-pct b { font-size: 22px; color: var(--heading); min-width: 56px; }
.big-pct .bar { flex: 1; height: 10px; }

/* ---------- الجداول ---------- */
.table-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
.t th { text-align: start; font-weight: 600; color: var(--muted); font-size: 13px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--row-hover); white-space: nowrap; }
.t td { padding: 10px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.t tr:last-child td { border-bottom: 0; }
.t tr.week-row td { background: var(--paper); font-weight: 700; color: var(--heading); font-size: 13px; padding: 7px 14px; }
.t tr.is-today td { background: var(--gold-soft); }
.t input, .t select { min-height: 34px; padding: 4px 8px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); width: 100%; min-width: 64px; }

/* ---------- دوام اليوم ---------- */
.dawam-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.date-nav { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); }
.date-nav input { border: 0; background: none; min-height: 38px; padding: 0 6px; }
.dawam-list { display: grid; gap: 10px; }
.t-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; grid-template-columns: minmax(170px, 1.1fr) auto minmax(130px, .8fr) minmax(150px, .9fr) minmax(200px, 1.3fr); gap: 14px; align-items: center; }
.t-row.st-absent, .t-row.st-excused { background: var(--row-hover); }
.t-row.st-absent .work, .t-row.st-excused .work { opacity: .35; pointer-events: none; }
.t-row.met { border-color: #A9CDB9; box-shadow: inset -4px 0 0 var(--green-3); }
.t-row .works { display: contents; }
.t-row .who { display: flex; gap: 10px; align-items: center; min-width: 0; }
.t-row .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.t-row .who small { display: block; font-size: 12px; color: var(--muted); line-height: 1.5; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--r-s); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 10px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; border-inline-start: 1px solid var(--line-2); min-height: 36px; }
.seg button:first-child { border-inline-start: 0; }
.seg button[aria-pressed=true].s-present { background: var(--green-2); color: #fff; }
.seg button[aria-pressed=true].s-late { background: var(--gold-2); color: #0F3D2E; }
.seg button[aria-pressed=true].s-absent { background: var(--red); color: #fff; }
.seg button[aria-pressed=true].s-excused { background: #6B7772; color: #fff; }
.work-cell { display: grid; gap: 4px; }
.work-cell > span { font-size: 12px; color: var(--muted); }
.stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); width: max-content; }
.stepper button { width: 34px; height: 34px; border: 0; background: none; display: grid; place-items: center; color: var(--green-2); cursor: pointer; }
.stepper button:hover { background: var(--green-soft); }
.stepper input { width: 46px; text-align: center; border: 0; font-weight: 700; min-height: 34px; background: none; -moz-appearance: textfield; }
.stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }
.stepper input::placeholder { color: #B5C1BB; font-weight: 500; }
.work-cell input.rev-label, .note-cell input { background: var(--surface); min-height: 34px; padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--r-s); font-size: 13px; width: 100%; }
.chips { display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-top: 5px; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 3px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 2px 9px; font-size: 12px; cursor: pointer; color: var(--ink-2); }
.chip:hover, .chip.on { border-color: var(--green-3); background: var(--green-soft); color: var(--heading); }
.met-btn { font-size: 12px; }
.savebar { position: sticky; bottom: 0; z-index: 15; margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--green); color: #E6EFEA; padding: 12px 16px; border-radius: var(--r); }
.savebar .counts { display: flex; gap: 16px; font-size: 14px; flex-wrap: wrap; }
.savebar .counts b { color: var(--gold-2); }

/* ---------- التقويم ---------- */
.cal-head { display: flex; align-items: center; gap: 10px; }
.cal-head h2 { font-size: 18px; min-width: 150px; text-align: center; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line-2); }
.cal .dow { padding: 8px; font-size: 12px; color: var(--muted); text-align: center; font-weight: 600; }
.cal .day { min-height: 104px; border-top: 1px solid var(--line-2); border-inline-start: 1px solid var(--line-2); padding: 6px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; background: var(--surface); }
.cal .day:nth-child(7n+1) { border-inline-start: 0; }
.cal .day.out { background: var(--row-hover); color: #A8B4AE; }
.cal .day.today .d { background: var(--green-2); color: #fff; }
.cal .day.sel { box-shadow: inset 0 0 0 2px var(--gold-2); }
.cal .d { font-size: 13px; font-weight: 600; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; }
.ev { display: block; width: 100%; text-align: start; border: 0; font-size: 12px; padding: 2px 7px; border-radius: 4px; background: color-mix(in srgb, var(--c) 16%, var(--surface)); color: color-mix(in srgb, var(--c) 75%, var(--ink)); border-inline-start: 3px solid var(--c); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.dots { display: none; gap: 3px; justify-content: center; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.agenda .li { align-items: flex-start; }
.date-box { width: 50px; flex: none; text-align: center; border-radius: var(--r-s); background: var(--paper); padding: 4px 0; line-height: 1.2; }
.date-box b { display: block; font-size: 18px; color: var(--heading); }
.date-box span { font-size: 11px; color: var(--muted); }

/* ---------- التقييم ---------- */
.notice { display: flex; gap: 12px; align-items: flex-start; background: var(--gold-soft); color: #5E4816; border-radius: var(--r); padding: 14px 18px; }
.axes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; }
.axis { padding: 18px 20px; border-inline-start: 1px solid var(--line-2); }
.axis:first-child { border-inline-start: 0; }
.axis h3 { font-size: 14px; color: var(--ink-2); font-weight: 600; }
.axis .score { font-size: 28px; font-weight: 700; color: #B5C1BB; margin-top: 6px; }
.axis .score small { font-size: 16px; color: var(--muted); font-weight: 500; }
.axis.total { background: var(--paper); border-radius: 0 var(--r) var(--r) 0; }
.axis.total .score { color: var(--muted); }

/* ---------- فارس الشهر ---------- */
.champ { position: relative; border-radius: var(--r-l); background: var(--green); color: #E6EFEA; padding: 30px; display: flex; gap: 26px; align-items: center; overflow: hidden; flex-wrap: wrap; }
.champ::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 12% 30%, rgba(201,162,78,.28), transparent 45%); pointer-events: none; }
.champ .ring { position: relative; padding: 5px; border-radius: 50%; background: conic-gradient(var(--gold-2), #F2DC9E, var(--gold-2)); }
.champ .ring .avatar { border: 4px solid var(--green); }
.champ .body { position: relative; flex: 1; min-width: 220px; display: grid; gap: 6px; }
.champ .month { color: var(--gold-2); font-weight: 600; }
.champ h2 { font-family: var(--naskh); font-size: 32px; color: #fff; }
.champ p { color: #CFE0D7; max-width: 60ch; }
.champ .facts { display: flex; gap: 18px; font-size: 14px; color: #B7CEC2; flex-wrap: wrap; margin-top: 4px; }
.champ .facts b { color: #fff; }

/* ---------- الإعدادات ---------- */
.set-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { display: inline-flex; align-items: center; gap: 4px; background: var(--paper); border: 1px solid var(--line); padding: 3px 4px 3px 10px; border-radius: 99px; font-size: 13px; }
.tag button { border: 0; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; padding: 2px; border-radius: 50%; }
.tag i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.inline-add { display: flex; gap: 6px; margin-top: 10px; }
.inline-add input { flex: 1; }
.perm-table td:not(:first-child), .perm-table th:not(:first-child) { text-align: center; }

/* ---------- المنبثقات ---------- */
.modal-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(15,30,24,.45); display: grid; place-items: center; padding: 20px; animation: fade .15s ease; }
.modal-backdrop.out { opacity: 0; transition: opacity .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(560px, 100%); max-height: calc(100vh - 40px); background: var(--surface); border-radius: var(--r-l); display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(10,30,20,.25); animation: pop .18s ease; }
.modal.wide { width: min(820px, 100%); }
@keyframes pop { from { transform: translateY(10px); opacity: 0; } }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line-2); }
.modal-head h2 { font-size: 18px; }
.modal-body { padding: 18px 20px; overflow-y: auto; display: grid; gap: 14px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line-2); }
.confirm-text { font-size: 15px; }
#toasts { position: fixed; z-index: 200; bottom: 24px; left: 24px; display: grid; gap: 8px; }
.toast { display: flex; align-items: center; gap: 10px; background: var(--green); color: #fff; padding: 11px 16px; border-radius: var(--r); box-shadow: 0 10px 30px rgba(10,30,20,.25); font-size: 14px; animation: pop .2s ease; max-width: 380px; }
.toast.t-err { background: var(--red); }
.toast.out { opacity: 0; transform: translateY(6px); transition: .3s; }

/* ---------- دوام السبت: بطاقات الطلاب ---------- */
.d-summary { display: flex; gap: 8px 18px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 16px; margin-bottom: 6px; font-size: 14px; }
.d-sec { font-size: 15px; font-weight: 700; color: var(--heading); margin: 16px 2px 2px; }
.d-row { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
.d-row.met { border-color: #A9CDB9; box-shadow: inset -4px 0 0 var(--green-3); }
.d-row.st-absent .d-work, .d-row.st-excused .d-work { opacity: .4; pointer-events: none; }
.d-row.st-absent, .d-row.st-excused { background: var(--row-hover); }
.d-head { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
.d-head .who { flex: 1 1 240px; display: flex; gap: 10px; align-items: center; min-width: 0; color: inherit; }
.d-head .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.d-head .who small { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 3px; }
.d-work { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
.req { border: 1px solid var(--line-2); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 8px; background: var(--paper); }
.req.k-mem { border-inline-start: 3px solid var(--green-3); }
.req.k-rev { border-inline-start: 3px solid var(--blue); }
.req-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 14px; flex-wrap: wrap; }
.req-in { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.req .rev-label, .d-row .note-cell input { min-height: 34px; padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--r-s); font-size: 13px; width: 100%; background: var(--surface); }
.seg.frac button { min-width: 44px; }
.seg.frac button[aria-pressed=true] { background: var(--blue); color: #fff; }
.late-box { background: var(--gold-soft); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 8px; }
.late-item { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.late-item .grow { flex: 1 1 200px; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip.off, .ev.off { text-decoration: line-through; opacity: .6; }
a.chip { color: var(--ink-2); }

/* ---------- خطة الطالب ---------- */
.plan-dl { display: grid; grid-template-columns: max-content 1fr; gap: 10px 20px; margin: 0; font-size: 14px; }
.plan-dl dt { color: var(--muted); }
.plan-dl dd { margin: 0; font-weight: 500; }
.juz-list { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.juz { display: inline-grid; place-items: center; min-width: 28px; height: 26px; padding: 0 6px; border-radius: 6px; background: var(--green-soft); color: var(--heading); font-weight: 700; font-size: 13px; }
.juz-pick { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; }
.juz-pick label { cursor: pointer; }
.juz-pick input { position: absolute; opacity: 0; pointer-events: none; }
.juz-pick span { display: grid; place-items: center; height: 34px; border: 1px solid var(--line); border-radius: 6px; font-weight: 600; font-size: 13px; background: var(--surface); }
.juz-pick input:checked + span { background: var(--green-2); border-color: var(--green-2); color: #fff; }
.juz-pick input:focus-visible + span { outline: 2px solid var(--gold-2); }
.metric-row.m3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.log-t td div + div { margin-top: 3px; }
.groups { display: grid; gap: 14px; }
.groups h3 { font-size: 14px; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.dawam-box { margin: 12px 16px 4px; padding: 12px 14px; border-radius: var(--r); background: var(--green-soft); display: grid; gap: 10px; }
.dawam-box > div:first-child { display: grid; }
.dawam-box.off { background: var(--line-2); }

/* ---------- المحاور الأربعة ---------- */
.axes-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.axis-card { position: relative; display: grid; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; color: inherit; border-top: 4px solid var(--c, var(--green-3)); }
.axis-card:hover { border-color: #B6C8BE; border-top-color: var(--c, var(--green-3)); }
.axis-card b { font-size: 15px; }
.axis-card .ax-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.axis-card .ax-head b { min-width: 0; line-height: 1.4; }
.axis-card .w { flex: none; font-size: 22px; font-weight: 700; line-height: 1.1; color: var(--c, var(--green-2)); }
.ax-memorization { --c: #33723C; } .ax-tarbawi { --c: #7A5AA6; } .ax-tajweed { --c: #0E7C86; } .ax-activities { --c: #B8913A; }
.axis-card .bar i { background: var(--c); }
.axis-w { font-size: 13px; font-weight: 700; color: var(--muted); background: var(--paper); border-radius: 99px; padding: 1px 8px; margin-inline-start: 6px; }
.axes-edit { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.c-row { flex-wrap: wrap; }
.c-row .seg button { min-width: 64px; }

/* ---------- الموبايل ---------- */
.bottomnav, .sheet { display: none; }
@media (max-width: 1100px) {
  .t-row { grid-template-columns: 1fr auto; }
  .t-row .note-cell { grid-column: 1 / -1; }
  .t-row .works { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .axes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .axis { border-top: 1px solid var(--line-2); }
  .axis.total { grid-column: 1 / -1; border-radius: 0 0 var(--r) var(--r); }
}
@media (max-width: 900px) {
  .axes-cards, .axes-edit { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .topbar { padding: 10px 16px; }
  .topbar .sem { display: none; }
  .m-title { display: flex; align-items: center; gap: 8px; font-family: var(--naskh); font-weight: 700; font-size: 16px; color: var(--heading); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .topbar { gap: 8px; }
  .demo-flag { white-space: nowrap; font-size: 11px; padding: 2px 8px; }
  .view { padding: 18px 16px calc(96px + var(--safe-b)); }
  .page-head h1 { font-size: 24px; }
  .page-head { margin-bottom: 16px; }
  .grid-2, .grid-3, .set-grid { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats .stat { border-inline-start: 0; border-top: 1px solid var(--line-2); }
  .stats .stat:nth-child(-n+2) { border-top: 0; }
  .stats .stat:nth-child(even) { border-inline-start: 1px solid var(--line-2); }
  .metric-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form-grid { grid-template-columns: 1fr; }
  .bottomnav { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; z-index: 40; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 4px calc(6px + var(--safe-b)); }
  .bottomnav a, .bottomnav button { display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 600; color: var(--muted); border: 0; background: none; padding: 4px 0; cursor: pointer; }
  .bottomnav .active { color: var(--heading); }
  .bottomnav .fab { margin-top: -22px; }
  .bottomnav .fab .circle { width: 54px; height: 54px; border-radius: 50%; background: var(--green-2); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 16px rgba(35,81,44,.35); border: 4px solid var(--paper); }
  .sheet.open { display: block; position: fixed; inset: 0; z-index: 90; background: rgba(15,30,24,.4); }
  .sheet .panel-s { position: absolute; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: var(--r-l) var(--r-l) 0 0; padding: 10px 12px calc(16px + var(--safe-b)); display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; animation: up .2s ease; }
  .sheet .grab { grid-column: 1 / -1; width: 40px; height: 4px; border-radius: 4px; background: var(--line); justify-self: center; margin-bottom: 8px; }
  .sheet a, .sheet button { display: grid; justify-items: center; gap: 6px; padding: 14px 4px; border-radius: var(--r); font-size: 13px; font-weight: 600; color: var(--ink-2); border: 0; background: var(--paper); cursor: pointer; }
  @keyframes up { from { transform: translateY(100%); } }
  .modal-backdrop { padding: 0; place-items: end stretch; }
  .modal, .modal.wide { width: 100%; max-height: 92vh; border-radius: var(--r-l) var(--r-l) 0 0; }
  .modal-foot { padding-bottom: calc(14px + var(--safe-b)); }
  .modal-foot .btn { flex: 1; }
  #toasts { left: 12px; right: 12px; bottom: calc(84px + var(--safe-b)); }
  .toast { max-width: none; }
  .savebar { bottom: calc(70px + var(--safe-b)); }
  .cal .day { min-height: 54px; align-items: center; padding: 4px 2px; }
  .cal .day .ev { display: none; }
  .cal .day .dots { display: flex; }
  .semester { padding: 18px; }
  .weeks { gap: 2px; }
  .champ { padding: 22px; gap: 16px; }
  .champ h2 { font-size: 26px; }
  .login { grid-template-columns: 1fr; }
  .login-side { padding: 32px 24px; min-height: 200px; }
  .toolbar select { flex: 1 1 45%; }
  .t th, .t td { padding: 9px 10px; }
}
@media (max-width: 640px) {
  .li { flex-wrap: wrap; row-gap: 6px; padding: 11px 16px; }
  .li .grow { flex: 1 1 150px; }
  .li .bars { flex: 1 1 100%; min-width: 0; padding-inline-start: 48px; }
  .t-row { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .t-row .seg { display: flex; }
  .t-row .seg button { flex: 1; }
  .dawam-bar > .input { flex: 1 1 45%; max-width: none !important; }
  .dawam-bar > span[style] { display: none; }
  .dawam-bar > .btn { flex: 1; }
}
@media (max-width: 520px) {
  .c-row .seg { width: 100%; display: flex; }
  .c-row .seg button { flex: 1; }
  .plan-dl { grid-template-columns: 1fr; gap: 2px; }
  .plan-dl dd { margin-bottom: 8px; }
  .juz-pick { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .metric-row.m3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .d-head .seg { display: flex; width: 100%; }
  .d-head .seg button { flex: 1; }
  .demo-flag { display: none; }
  .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 10px; }
  .s-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .s-info { padding: 10px; }
  .s-card h3 { font-size: 14px; }
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dd { margin-bottom: 8px; }
  .user-chip .uname { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- الطباعة ---------- */
.print-only { display: none; }
@media print {
  body { background: #fff; font-size: 12px; }
  .sidebar, .topbar, .bottomnav, .no-print, .toolbar, #toasts { display: none !important; }
  .shell { display: block; }
  .view { padding: 0; max-width: none; }
  .print-only { display: block; }
  .panel { border: 0; }
  .t th { background: #eee; }
}
.axis-w, .axis-card .w, .num { unicode-bidi: isolate; direction: ltr; }
.role-banner { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: space-between; background: var(--gold-soft); color: #5E4816; padding: 8px 28px; font-size: 14px; border-bottom: 1px solid var(--line); }
@media (max-width: 900px) { .role-banner { padding: 8px 16px; font-size: 13px; } }

/* ---------- الواجهة العامة (بدون تسجيل دخول) ---------- */
.pub { min-height: 100vh; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); }
.pub a { text-decoration: none; }
.pub-head { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: var(--topbar-bg); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.pub-brand { display: flex; align-items: center; gap: 10px; color: inherit; min-width: 0; }
.pub-brand img { border-radius: 8px; flex: none; }
.pub-brand b { display: block; font-family: var(--naskh); font-size: 19px; color: var(--heading); line-height: 1.3; }
.pub-brand small { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pub-login { flex: none; font-size: 13px; color: var(--green-2); border: 1px solid var(--line); border-radius: 99px; padding: 6px 14px; background: var(--surface); }
.pub-login:hover { border-color: var(--green-3); }
.pub-body { flex: 1; width: min(1120px, 100%); margin: 0 auto; padding: 22px 16px 36px; display: grid; gap: 22px; align-content: start; }
.pub-hero { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 24px; }
.pub-hero img { width: 200px; max-width: 100%; height: auto; background: #fff; border-radius: var(--r); }
.pub-hero h1 { font-family: var(--naskh); font-size: 32px; color: var(--heading); line-height: 1.35; }
.pub-hero p { color: var(--ink-2); margin-top: 4px; max-width: 60ch; }
.pub-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.pub-stats div { background: var(--green-soft); border-radius: var(--r); padding: 10px 16px; min-width: 120px; }
.pub-stats dt { font-size: 12px; color: var(--muted); }
.pub-stats dd { font-size: 18px; font-weight: 700; color: var(--green-2); }
.pub-sec-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.pub-sec-head h2 { font-family: var(--naskh); font-size: 24px; color: var(--heading); }
.pub-tag { font-size: 12px; color: var(--gold); background: var(--gold-soft); border-radius: 99px; padding: 2px 10px; }
.pub-q { margin-inline-start: auto; width: min(280px, 100%); padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: var(--ink); font: inherit; }
.pub-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.pub-card { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; color: inherit; transition: border-color .15s, transform .15s; }
.pub-card:hover { border-color: var(--green-3); transform: translateY(-1px); }
.pub-card-main { flex: 1; min-width: 0; display: grid; gap: 2px; }
.pub-card-main > b { font-size: 15px; }
.pub-card-main > small { font-size: 12px; color: var(--muted); }
.pub-mini { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.pub-mini > span { white-space: nowrap; }
.pub-mini b { color: var(--ink-2); }
.pub-pct { color: var(--green-2) !important; }
.pub-back { justify-self: start; font-size: 14px; color: var(--green-2); }
.pub-profile { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 22px 24px; }
.pub-id { display: flex; align-items: center; gap: 18px; min-width: 0; }
.pub-id h1 { font-family: var(--naskh); font-size: 28px; color: var(--heading); line-height: 1.35; }
.pub-id p { color: var(--muted); }
.pub-badge { display: inline-block; margin-top: 6px; font-size: 13px; color: var(--gold); background: var(--gold-soft); border-radius: 99px; padding: 3px 12px; }
.pub-ring { --p: 0; width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--green-3) calc(var(--p) * 1%), var(--line-2) 0); flex: none; }
.pub-ring > span { width: 94px; height: 94px; border-radius: 50%; background: var(--surface); display: grid; place-content: center; text-align: center; }
.pub-ring b { font-size: 24px; color: var(--green-2); line-height: 1.1; }
.pub-ring small { font-size: 11px; color: var(--muted); }
.pub-kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.pub-kpis div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 4px; }
.pub-kpis small { font-size: 12px; color: var(--muted); }
.pub-kpis b { font-size: 17px; color: var(--ink); }
.pub-cols { display: grid; grid-template-columns: 1.1fr 1fr; gap: 14px; align-items: start; }
.pub-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; display: grid; gap: 14px; }
.pub-box h2 { font-size: 16px; font-weight: 700; color: var(--heading); }
.pub-meter { display: grid; gap: 6px; }
.pub-meter-head { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.pub-meter-head b { color: var(--green-2); font-size: 13px; }
.pub-meter .bar { height: 9px; }
.pub-meter small { font-size: 12px; color: var(--muted); }
.pub-eval { display: flex; justify-content: space-between; border-top: 1px solid var(--line-2); padding-top: 12px; }
.pub-eval b { color: var(--gold); font-size: 18px; }
.pub-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.pub-list li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--r-s); background: var(--paper); }
.pub-ico { font-size: 18px; line-height: 1.4; }
.pub-list b { display: block; font-size: 14px; }
.pub-list small { display: block; font-size: 12px; color: var(--muted); }
.pub-updated { font-size: 12px; color: var(--muted); text-align: center; }
.pub-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 16px; padding: 18px 16px; border-top: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--muted); }
.pub-foot img { height: 40px; width: auto; background: #fff; border-radius: 6px; }
@media (max-width: 820px) { .pub-cols { grid-template-columns: 1fr; } .pub-kpis { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 600px) {
  .pub-hero { grid-template-columns: 1fr; text-align: center; padding: 18px; } .pub-hero img { width: 160px; justify-self: center; } .pub-hero h1 { font-size: 26px; }
  .pub-stats { justify-content: center; display: grid; grid-template-columns: repeat(3, 1fr); } .pub-stats div { min-width: 0; padding: 10px 8px; } .pub-stats dt { font-size: 11px; }
  .pub-grid { grid-template-columns: 1fr; } .pub-q { margin-inline-start: 0; width: 100%; }
  .pub-profile { flex-direction: column; text-align: center; padding: 18px; } .pub-id { flex-direction: column; } .pub-id h1 { font-size: 23px; }
  .pub-brand small { display: none; }
}
@media print { .pub-head, .pub-q, .pub-back { display: none; } .pub-card, .pub-box, .pub-kpis div { break-inside: avoid; } }
.pub-count { display: inline-block; min-width: 24px; text-align: center; font-size: 12px; font-weight: 600; color: var(--green-2); background: var(--green-soft); border-radius: 99px; padding: 1px 8px; margin-inline-start: 6px; vertical-align: middle; }
